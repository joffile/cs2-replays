<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS2 Replay</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0 auto;min-height:100vh;max-width:640px;padding:16px;background:#0f1115;color:#eef0f4;font-family:system-ui,sans-serif}
h1{font-size:22px;margin:8px 0}
h2{font-size:17px;margin:20px 0 8px}
a{color:#4f8cff}
.muted{color:#8a909c;font-size:14px}
input{width:100%;box-sizing:border-box;background:#181b22;color:#eef0f4;border:1px solid #2a2f3b;border-radius:10px;padding:12px;font-size:16px;margin:4px 0}
button{background:#4f8cff;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;cursor:pointer}
button.alt{background:#222735}
.item{display:block;background:#181b22;border-radius:10px;padding:12px;margin:6px 0;color:#eef0f4;text-decoration:none}
canvas{display:block;width:100%;aspect-ratio:1/1;border-radius:12px;background:#0b0d12;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=range]{flex:1;min-width:120px;padding:0}
#clock{font-variant-numeric:tabular-nums;font-size:14px}
</style>
</head>
<body>
<h1>Мои повторы CS2</h1>
<p id="status" class="muted"></p>

<section id="home" hidden>
  <h2>Открыть демку по ссылке</h2>
  <input id="url" type="url" placeholder="Вставьте ссылку на демку (.dem, .dem.bz2 или .zip)">
  <input id="name" type="text" placeholder="Название (необязательно)">
  <p><button id="go">Открыть демку</button></p>
  <p class="muted">Разбор занимает несколько минут. Не закрывайте страницу, пока идёт загрузка.</p>
  <h2>Сохранённые повторы</h2>
  <div id="list"></div>
</section>

<section id="viewer" hidden>
  <p><a href="#">← Все повторы</a></p>
  <h2 id="title"></h2>
  <canvas id="cv" width="600" height="600"></canvas>
  <div class="row">
    <button id="play">▶</button>
    <input id="seek" type="range" min="0" value="0">
    <span id="clock">0:00</span>
  </div>
  <div class="row">
    <button class="alt" data-s="1">1x</button>
    <button class="alt" data-s="2">2x</button>
    <button class="alt" data-s="4">4x</button>
  </div>
  <p id="legend" class="muted"></p>
</section>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const errText = e => (e && e.message) || String(e);
let meta = null, frames = [], bounds = null, idx = 0, timer = null, speed = 1;

const setStatus = t => { $("#status").textContent = t; };

async function api(p, opts = {}) {
  const r = await fetch(p, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-key": localStorage.getItem("key") || "" }
  });
  if (r.status === 401) {
    const k = prompt("Введите ключ доступа (ACCESS_KEY из настроек Render)");
    if (!k) throw new Error("нет ключа доступа");
    localStorage.setItem("key", k);
    return api(p, opts);
  }
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "ошибка сервера");
  return data;
}

function show(view) {
  $("#home").hidden = view !== "home";
  $("#viewer").hidden = view !== "viewer";
}

async function renderList() {
  const list = await api("/api/list");
  const box = $("#list");
  box.textContent = "";
  if (!list.length) { box.textContent = "Пока пусто. Вставьте ссылку выше."; return; }
  for (const it of list) {
    const a = document.createElement("a");
    a.className = "item";
    a.href = "#" + it.id;
    a.textContent = it.title + " · " + new Date(it.created).toLocaleDateString("ru-RU");
    box.append(a);
  }
}

function calcBounds() {
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const f of frames) {
    for (let j = 1; j + 3 < f.length; j += 4) {
      minX = Math.min(minX, f[j + 1]); maxX = Math.max(maxX, f[j + 1]);
      minY = Math.min(minY, f[j + 2]); maxY = Math.max(maxY, f[j + 2]);
    }
  }
  bounds = { minX, minY, span: Math.max(maxX - minX, maxY - minY, 1) };
}

function draw() {
  const cv = $("#cv"), g = cv.getContext("2d"), W = cv.width, H = cv.height;
  g.fillStyle = "#0b0d12";
  g.fillRect(0, 0, W, H);
  g.strokeStyle = "#1d2230";
  g.lineWidth = 1;
  for (let i = 1; i < 10; i++) {
    g.beginPath(); g.moveTo(i * W / 10, 0); g.lineTo(i * W / 10, H); g.stroke();
    g.beginPath(); g.moveTo(0, i * H / 10); g.lineTo(W, i * H / 10); g.stroke();
  }
  const f = frames[idx];
  if (!f || !bounds) return;
  const sc = (W * 0.94) / bounds.span;
  for (let j = 1; j + 3 < f.length; j += 4) {
    const x = (f[j + 1] - bounds.minX) * sc + W * 0.03;
    const y = H - ((f[j + 2] - bounds.minY) * sc + H * 0.03);
    g.fillStyle = f[j + 3] === 2 ? "#f0a040" : "#4f8cff";
    g.beginPath(); g.arc(x, y, 8, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#eef0f4";
    g.font = "bold 22px system-ui";
    g.fillText((meta && meta.players && meta.players[f[j]]) || "", x + 12, y + 7);
  }
  const s = Math.floor(f[0] / 64);
  $("#clock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

async function openReplay(id) {
  setStatus("Загружаю повтор…");
  const data = await api("/api/replay/" + id);
  meta = data;
  frames = [];
  for (const k of Object.keys(data.chunks).map(Number).sort((a, b) => a - b)) {
    for (const f of data.chunks[k]) frames.push(f);
  }
  calcBounds();
  idx = 0;
  $("#title").textContent = data.title || "Повтор";
  $("#seek").max = Math.max(0, frames.length - 1);
  $("#seek").value = 0;
  $("#legend").textContent = "Оранжевые точки — T, синие — CT. Картинка карты пока не подключена.";
  setStatus(frames.length ? "" : "В повторе нет данных");
  show("viewer");
  draw();
}

function sync() { $("#seek").value = idx; draw(); }

function play(on) {
  clearInterval(timer);
  timer = null;
  $("#play").textContent = on ? "⏸" : "▶";
  if (on) {
    timer = setInterval(() => {
      if (idx >= frames.length - 1) return play(false);
      idx++;
      sync();
    }, 250 / speed);
  }
}

async function route() {
  const id = location.hash.slice(1);
  play(false);
  try {
    if (id) { await openReplay(id); return; }
    show("home");
    setStatus("");
    await renderList();
  } catch (e) {
    setStatus("Ошибка: " + errText(e));
  }
}

$("#play").onclick = () => play(!timer);
$("#seek").oninput = e => { idx = Number(e.target.value); draw(); };
document.querySelectorAll("[data-s]").forEach(b => {
  b.onclick = () => { speed = Number(b.dataset.s); if (timer) play(true); };
});

$("#go").onclick = async () => {
  const url = $("#url").value.trim();
  if (!url) { setStatus("Сначала вставьте ссылку"); return; }
  try {
    const { id } = await api("/api/load", {
      method: "POST",
      body: JSON.stringify({ url, title: $("#name").value.trim() })
    });
    setStatus("Запущено. Не закрывайте страницу.");
    for (;;) {
      await sleep(3000);
      let st;
      try { st = await api("/api/status/" + id); }
      catch (e) { setStatus("Жду ответ сервера…"); continue; }
      if (st.state === "готово") { location.hash = id; return; }
      if (st.state === "ошибка") throw new Error(st.error);
      if (st.state === "неизвестно") throw new Error("сервер перезапустился, попробуйте ещё раз");
      setStatus(st.state + "…");
    }
  } catch (e) {
    setStatus("Ошибка: " + errText(e) + ". Скопируйте этот текст и пришлите мне.");
  }
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
